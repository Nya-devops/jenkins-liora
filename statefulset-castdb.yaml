apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cast-db
  labels:
    app: cast-db
spec:
  serviceName: cast-db
  replicas: 1
  selector:
    matchLabels:
      app: cast-db
  template:
    metadata:
      labels:
        app: cast-db
    spec:
      containers:
        - image: postgres:12.1-alpine
          name: cast-db
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: secrets-cast
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secrets-cast
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: secrets-cast
                  key: POSTGRES_DB
          ports:
            - containerPort: 5432     # from Postgres documentation
              protocol: TCP
          volumeMounts:
            - name: castdb-pvc
              mountPath: /var/lib/postgresql/data/     
  volumeClaimTemplates:
  - metadata:
      name: castdb-pvc
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi

---

apiVersion: v1
kind: Service
metadata:
  name: cast-db
  labels:
    app: cast-db
spec:
  ports:
  - port: 5432
    name: cast-db
  clusterIP: None    # Headless
  selector:
    app: cast-db
