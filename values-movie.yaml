# Default values for fastapiapp.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 3

fullnameOverride: "movie-service"  # to lock-in DNS

image:
  repository: nyamzz/movie-service
  pullPolicy: Always   # Jenkins rebuilds and pushes the same tag (1.0.0) every run to ensure that the latest image is pulled from DockerHub.
  tag: 1.0.0   

env:
  DATABASE_URI: "postgresql://movie_db_username:movie_db_password@movie-db/movie_db_dev"
  CAST_SERVICE_HOST_URL: "http://cast-service/api/v1/casts/"

probePath: /api/v1/movies/   # to be used for liveness and readiness probes.

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP    # NodePort not required since we're using Ingress
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: traefik     # k3 built-in ingress controller
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: ""
      paths:
        - path: /api/v1/movies
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
